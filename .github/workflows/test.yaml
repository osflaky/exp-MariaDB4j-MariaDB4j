name: Java Maven Test CI (Linux + Windows + macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

# Cancel any in-progress job or run if there is a newer commit
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  testOnLinux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: Maven Verify (Build & Test) on Linux [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    permissions:
      # maven-dependency-submission-action needs write
      contents: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1   # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # https://github.com/marketplace/actions/cache-apt-packages
    - uses: 
        awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9       # latest
      with:
        packages: mariadb-server
        version: 1.0
      # https://github.com/marketplace/actions/setup-java-jdk
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c   # v6.0.0
      with:
        distribution: temurin
        java-version-file: .java-version
        cache: maven
      # Run verify, not just package, to catch any failures of mariaDB4j-maven-plugin's integration test
    - run: ./mvnw --show-version --batch-mode --strict-checksums verify

      # https://github.com/marketplace/actions/maven-dependency-tree-dependency-submission
    - name: Maven Dependency Tree Dependency Submission
      if: ${{ github.event_name == 'push' }}
      uses: 
        advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c       # v6.0.1

    timeout-minutes: 150
